<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Melodies of Courage — In Memory of Kevin Chen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #eef1f4; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  /* The layout itself is fluid; this is a guard so no stray wide child can
     produce a sideways scroll on a phone. */
  body { overflow-x: hidden; }
  img, iframe { max-width: 100%; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="directions/shared.js"></script>
<script type="text/babel" src="site/nocturne-v2.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function Boot() {
  const [ready, setReady] = useState(false);
  useEffect(() => {
    const tick = () => {
      if (window.MOCSite) setReady(true);
      else setTimeout(tick, 60);
    };
    tick();
  }, []);

  if (!ready) return <div style={{padding: 40, fontFamily:"serif", color:"#3b5079"}}>Loading…</div>;
  const Site = window.MOCSite;
  return <Site paletteId="dawn" paperId="mist"/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boot/>);
</script>
</body>
</html>
